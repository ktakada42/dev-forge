version: 2

# Saturday 09:00 JST is the shared Dependabot window across dev-forge, gwx and
# saitama-gomi-calendar, so a week's bumps land together and get reviewed in
# one sitting instead of one repository at a time.
updates:
  # Rust dependencies. Minor and patch bumps arrive as a single grouped PR;
  # major bumps stay separate so each one can be reviewed on its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  # Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
