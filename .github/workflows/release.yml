name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The tag is cut from a commit that already carries the release version, so a
  # mismatch means the bump never landed on main. Fail here, before anything is
  # published, rather than halfway through the release.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # shell: bash for pipefail — without it a cargo failure inside the
      # command substitution is masked by jq's exit code, and the mismatch is
      # reported with an empty version instead of cargo's own error.
      - name: Check the tag against Cargo.toml
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          # Resolving with --locked also fails when Cargo.lock is stale, which
          # is what makes the --locked publish below safe. Leaving --no-deps off
          # is deliberate: without a full resolve, a stale lock goes unnoticed.
          ACTUAL=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "dev-forge") | .version')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Cargo.toml is at ${ACTUAL} but the tag is ${TAG}. Bump the version on main first, then tag that commit."
            exit 1
          fi
          echo "Cargo.toml and ${TAG} agree on ${ACTUAL}."

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ARCHIVE="forge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release forge
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release and upload assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            *.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: this job asks GitHub for a JWT and trades it for a
      # short-lived crates.io token, so there is no registry secret to keep.
      # Job-level permissions replace the workflow-level ones, so the read that
      # checkout needs has to be spelled out again here.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Compute SHA256
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            sha=$(sha256sum "forge-${VERSION}-${target}.tar.gz" | awk '{print $1}')
            key="SHA_$(echo "${target}" | tr '-' '_')"
            echo "${key}=${sha}" >> "$GITHUB_ENV"
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VER=${VER}"         >> "$GITHUB_ENV"

      - name: Generate a token for the tap repo
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ktakada42
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: ktakada42/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          cat > homebrew-tap/Formula/forge.rb << EOF
          class Forge < Formula
            desc "Interactive CLI REPL for encoding, decoding, and conversion tasks"
            homepage "https://github.com/ktakada42/dev-forge"
            version "${VER}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/ktakada42/dev-forge/releases/download/${VERSION}/forge-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_aarch64_apple_darwin}"
              else
                url "https://github.com/ktakada42/dev-forge/releases/download/${VERSION}/forge-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_x86_64_apple_darwin}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/ktakada42/dev-forge/releases/download/${VERSION}/forge-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_aarch64_unknown_linux_musl}"
              else
                url "https://github.com/ktakada42/dev-forge/releases/download/${VERSION}/forge-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_x86_64_unknown_linux_musl}"
              end
            end

            def install
              bin.install "forge"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/forge --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name  "${{ steps.tap-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.tap-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add Formula/forge.rb
          git commit -m "forge ${VER}"
          git push
