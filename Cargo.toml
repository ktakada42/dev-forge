[package]
name = "dev-forge"
version = "2.0.0"
edition = "2021"
description = "Interactive CLI REPL for encoding, decoding, and conversion tasks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ktakada42/dev-forge"
homepage = "https://github.com/ktakada42/dev-forge"
keywords = ["cli", "repl", "base64", "jwt", "timestamp"]
categories = ["command-line-utilities", "encoding", "date-and-time"]
# Only what the crate needs to build, plus the README and the GIF it shows.
exclude = [".github/", ".idea/", "assets/demo.tape", "codecov.yml", "install.sh"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reedline = "0.50"
crossterm = "0.29"
base64 = "0.23"
urlencoding = "2"
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
